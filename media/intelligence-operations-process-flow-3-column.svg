<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Strategic Intelligence Operations three-column process flow</title>
  <desc id="desc">Three-column vertical process flow covering plan and configuration, execution and remediation, and synthesis review and publication.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f472b6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".24"/>
    </filter>
    <style>
      .bg{fill:#0b0b12}
      .column{fill:rgba(255,255,255,.018);stroke:rgba(255,255,255,.09);stroke-width:1.5;rx:22}
      .request{fill:rgba(255,255,255,.055);stroke:rgba(255,255,255,.20);stroke-width:2;rx:16}
      .agent{fill:rgba(59,130,246,.12);stroke:#60a5fa;stroke-width:2.3;rx:16;filter:url(#shadow)}
      .workflow{fill:rgba(244,114,182,.11);stroke:#f472b6;stroke-width:2.3;rx:16}
      .data{fill:rgba(167,139,250,.13);stroke:#a78bfa;stroke-width:2.3;rx:16}
      .memory{fill:rgba(34,211,238,.11);stroke:#22d3ee;stroke-width:2.3;rx:16}
      .success{fill:rgba(52,211,153,.11);stroke:#34d399;stroke-width:2.3;rx:16}
      .warning{fill:rgba(251,146,60,.12);stroke:#fb923c;stroke-width:2.3;rx:16}
      .decision{fill:rgba(251,146,60,.12);stroke:#fb923c;stroke-width:2.3}
      .human{fill:rgba(34,211,238,.11);stroke:#22d3ee;stroke-width:2.3}
      .h{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#ffffff}
      .t{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#d7d7df}
      .s{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#a6a6b4;letter-spacing:.1em}
      .columnTitle{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#ffffff;letter-spacing:.04em}
      .columnSub{font:500 12px 'Segoe UI',Arial,sans-serif;fill:#a6a6b4}
      .label{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#a78bfa}
      .labelBlue{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#60a5fa}
      .labelPink{font:700 11px 'Segoe UI',Arial,sans-serif;fill:#f472b6}
      .arrow{stroke:#a78bfa;stroke-width:2.7;fill:none;marker-end:url(#arrow)}
      .arrowBlue{stroke:#60a5fa;stroke-width:2.5;fill:none;marker-end:url(#arrowBlue)}
      .arrowPink{stroke:#f472b6;stroke-width:2.5;fill:none;marker-end:url(#arrowPink)}
      .dash{stroke-dasharray:8 7}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <circle cx="40" cy="-30" r="320" fill="#3b82f6" opacity=".12"/>
  <circle cx="1580" cy="900" r="380" fill="#ec4899" opacity=".11"/>

  <text class="h" x="52" y="48" style="font-size:26px">Strategic Intelligence Operations — Governed Process Flow</text>
  <text class="t" x="52" y="76">Three vertical phases · bounded execution · deterministic remediation · accountable human review</text>

  <!-- Column containers -->
  <rect class="column" x="42" y="108" width="480" height="742"/>
  <rect class="column" x="560" y="108" width="480" height="742"/>
  <rect class="column" x="1078" y="108" width="480" height="742"/>

  <text class="columnTitle" x="70" y="143">01 · PLAN &amp; CONFIGURE</text>
  <text class="columnSub" x="70" y="166">Confirm scope before creating operational work</text>
  <text class="columnTitle" x="588" y="143">02 · EXECUTE &amp; REMEDIATE</text>
  <text class="columnSub" x="588" y="166">Process each bounded work item independently</text>
  <text class="columnTitle" x="1106" y="143">03 · SYNTHESISE, REVIEW &amp; PUBLISH</text>
  <text class="columnSub" x="1106" y="166">Continue only when blocking work is terminal</text>

  <!-- Column 1 -->
  <rect class="request" x="108" y="200" width="346" height="76"/>
  <text class="s" x="134" y="225">REQUEST</text>
  <text class="h" x="134" y="251">Run new report</text>

  <rect class="agent" x="108" y="316" width="346" height="104"/>
  <text class="s" x="134" y="342">ORCHESTRATE</text>
  <text class="h" x="134" y="369">Read approved configuration</text>
  <text class="t" x="134" y="394">Domain · entities · sources · template · policy</text>

  <polygon class="decision" points="281,458 402,516 281,574 160,516"/>
  <text class="h" x="281" y="510" text-anchor="middle">Valid scope?</text>
  <text class="t" x="281" y="533" text-anchor="middle">gates 1–5</text>

  <rect class="warning" x="76" y="622" width="174" height="112"/>
  <text class="s" x="98" y="648">NO · BOOTSTRAP</text>
  <text class="t" x="98" y="676">Create missing</text>
  <text class="t" x="98" y="698">configuration, profiles</text>
  <text class="t" x="98" y="720">or registry entries</text>

  <rect class="data" x="276" y="622" width="214" height="112"/>
  <text class="s" x="300" y="648">YES · DATAVERSE</text>
  <text class="h" x="300" y="676">Create IO Run</text>
  <text class="t" x="300" y="700">Create bounded</text>
  <text class="t" x="300" y="720">Queued Work Items</text>

  <path class="arrow" d="M281 276 V316"/>
  <path class="arrow" d="M281 420 V458"/>
  <path class="arrowPink" d="M221 552 C180 572 163 590 163 622"/>
  <text class="labelPink" x="157" y="582">NO</text>
  <path class="arrow" d="M341 552 C382 574 383 590 383 622"/>
  <text class="label" x="372" y="582">YES</text>
  <path class="arrowPink dash" d="M163 734 V790 H64 V368 H108"/>
  <text class="labelPink" x="72" y="812">RETRY AFTER SETUP</text>

  <!-- Column 2 -->
  <rect class="workflow" x="626" y="200" width="346" height="90"/>
  <text class="s" x="652" y="226">NATIVE WORKFLOW TRIGGER</text>
  <text class="h" x="652" y="253">Pick up IO Work Item</text>
  <text class="t" x="652" y="276">Queued, or Needs Remediation with retries &lt; 3</text>

  <rect class="workflow" x="626" y="326" width="346" height="90"/>
  <text class="s" x="652" y="352">MANDATORY STATE</text>
  <text class="h" x="652" y="379">Start attempt</text>
  <text class="t" x="652" y="402">Set In Progress · increment Retries</text>

  <rect class="agent" x="626" y="452" width="346" height="106"/>
  <text class="s" x="652" y="478">INLINE WORKER</text>
  <text class="h" x="652" y="505">Research bounded task</text>
  <text class="t" x="652" y="530">Hydrate context · use approved sources</text>
  <text class="t" x="652" y="550">Write specific Worker Notes</text>

  <rect class="data" x="626" y="594" width="346" height="104"/>
  <text class="s" x="652" y="620">PERSIST RESULT</text>
  <text class="h" x="652" y="647">Evidence + findings + status</text>
  <text class="t" x="652" y="672">IO Evidence Source · IO Finding · Approval Item</text>

  <polygon class="decision" points="799,722 906,772 799,822 692,772"/>
  <text class="h" x="799" y="779" text-anchor="middle">Resolved?</text>

  <rect class="warning" x="576" y="742" width="92" height="74"/>
  <text class="s" x="622" y="764" text-anchor="middle">&lt;2 retries</text>
  <text class="t" x="622" y="786" text-anchor="middle">Needs</text>
  <text class="t" x="622" y="804" text-anchor="middle">Remediation</text>

  <rect class="human" x="930" y="742" width="92" height="74"/>
  <text class="s" x="976" y="764" text-anchor="middle">3 retries</text>
  <text class="t" x="976" y="786" text-anchor="middle">Review</text>
  <text class="t" x="976" y="804" text-anchor="middle">or Failed</text>

  <path class="arrow" d="M799 290 V326"/>
  <path class="arrow" d="M799 416 V452"/>
  <path class="arrow" d="M799 558 V594"/>
  <path class="arrow" d="M799 698 V722"/>
  <path class="arrowPink" d="M692 772 H668"/>
  <path class="arrowBlue" d="M906 772 H930"/>
  <path class="arrowPink dash" d="M622 742 C590 720 590 690 590 650 V245 H626"/>
  <text class="labelPink" x="594" y="624">RETRY</text>
  <text class="labelBlue" x="920" y="718">ATTEMPT 3</text>

  <!-- Cross-column handoffs -->
  <path class="arrow" d="M490 678 C530 678 530 245 626 245"/>
  <text class="label" x="512" y="458">QUEUED WORK ITEMS</text>

  <!-- Column 3 -->
  <polygon class="decision" points="1318,196 1435,252 1318,308 1201,252"/>
  <text class="h" x="1318" y="258" text-anchor="middle">All Work Items resolved</text>

  <rect class="agent" x="1145" y="346" width="346" height="98"/>
  <text class="s" x="1171" y="372">SYNTHESISE</text>
  <text class="h" x="1171" y="399">Generate cited report</text>
  <text class="t" x="1171" y="424">Template + findings + reviewer-verification flags</text>

  <rect class="memory" x="1145" y="480" width="346" height="98"/>
  <text class="s" x="1171" y="506">OUTPUT ARTEFACTS</text>
  <text class="h" x="1171" y="533">Markdown + HTML drafts</text>
  <text class="t" x="1171" y="558">SharePoint files · IO Output Artifact · approval</text>

  <polygon class="human" points="1318,612 1432,666 1318,720 1204,666"/>
  <text class="h" x="1318" y="660" text-anchor="middle">Human review</text>
  <text class="t" x="1318" y="682" text-anchor="middle">approved?</text>

  <rect class="success" x="1145" y="760" width="346" height="72"/>
  <text class="s" x="1171" y="780">PUBLISH</text>
  <text class="h" x="1171" y="804">Release report +</text>
  <text class="h" x="1171" y="825">approved learned context</text>

  <path class="arrow" d="M1318 308 V346"/>
  <text class="label" x="1330" y="330">YES</text>
  <path class="arrow" d="M1318 444 V480"/>
  <path class="arrow" d="M1318 578 V612"/>
  <path class="arrowBlue" d="M1318 720 V760"/>
  <text class="labelBlue" x="1330" y="744">APPROVED</text>
  <path class="arrowPink dash" d="M1204 666 H1104 V529 H1145"/>
  <text class="labelPink" x="1090" y="644">CHANGES / REJECTED</text>
  <path class="arrow dash" d="M1201 252 H1104 V200"/>
  <text class="label" x="1090" y="238">NO · WAIT</text>

  <path class="arrowBlue" d="M906 772 C1034 772 1036 252 1201 252"/>
  <text class="labelBlue" x="1018" y="506">TERMINAL STATUS</text>

  <text class="t" x="52" y="880">Managed App oversight spans all three columns: run health · work queue · evidence · findings · outputs · approvals · registries</text>
</svg>
